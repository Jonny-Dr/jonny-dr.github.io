<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%238b5cf6'/%3E%3Cstop offset='100%25' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23grad)'/%3E%3Cpath d='M12 12h8v8h-8z' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M14 14h4v4h-4z' fill='white'/%3E%3Cpath d='M16 6v3M16 23v3M6 16h3M23 16h3' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M9 9l2 2M21 21l2 2M9 23l2-2M21 9l2-2' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" type="image/svg+xml">
  <link rel="stylesheet" href="{{basePath}}css/common.css">
</head>
<body class="listing-page home-page">
  <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <button class="music-toggle" id="musicToggle" aria-label="控制音乐">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 18V5l12-2v13"></path>
      <circle cx="6" cy="18" r="3"></circle>
      <circle cx="18" cy="16" r="3"></circle>
    </svg>
  </button>

  <header>
    <h1>
      <span class="header-icon">{{icon}}</span>
      <span class="header-title">{{headerTitle}}</span>
    </h1>
    <p class="subtitle">{{headerSubtitle}}</p>
    {{nav}}
  </header>

  <main class="home-content">
    <section class="surface-card home-intro" aria-labelledby="home-intro-title">
      <h2 id="home-intro-title">记录技术思考，分享实践经验</h2>
      <p>我是北辰，在这里记录后端开发、AI 工程与个人成长中的思考和实践。</p>
      <div class="action-row">
        <a href="{{basePath}}html/skill/skill.html" class="site-button">技术文章 →</a>
        <a href="{{basePath}}html/ai/ai.html" class="site-button">AI 笔记 →</a>
        <a href="{{basePath}}about.html" class="site-button">关于我 →</a>
      </div>
    </section>

    <section class="content-section" id="latest-posts" aria-labelledby="latest-posts-title">
      <div class="section-heading">
        <h2 id="latest-posts-title">最新文章</h2>
        <span>{{articleCount}} 篇文章 · 最新发布在前</span>
      </div>
      {{content}}
      <div class="action-row more-articles" aria-label="浏览更多栏目">
        <span>继续浏览</span>
        <a href="{{basePath}}html/skill/skill.html" class="site-button">技术</a>
        <a href="{{basePath}}html/ai/ai.html" class="site-button">AI</a>
        <a href="{{basePath}}html/project/project.html" class="site-button">项目</a>
        <a href="{{basePath}}html/daily/daily.html" class="site-button">日常</a>
      </div>
    </section>

    <section class="content-section" aria-labelledby="home-skills-title">
      <div class="section-heading">
        <h2 id="home-skills-title">技术栈</h2>
        <a href="{{basePath}}about.html" class="section-link">了解更多 →</a>
      </div>
      <div class="skills-categories">
        {{skills}}
      </div>
    </section>
  </main>



  <footer>
    <p>© 2026 北辰 · 保持好奇，持续成长</p>
    <p style="margin-top: 6px; font-size: 0.9rem; color: #aaa;">
      本博客采用 <a href="https://creativecommons.org/licenses/by-nc/4.0/" style="color: var(--primary);">CC BY-NC 4.0</a> 许可 | 
      源码托管于 <a href="https://github.com/" style="color: var(--primary);">GitHub</a>
    </p>
  </footer>

  <button class="back-to-top" id="backToTop" aria-label="回到顶部">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="m18 15-6-6-6 6"/>
    </svg>
  </button>

  <script src="{{basePath}}js/theme.js"></script>
</body>
</html>
